name: shellcheck

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check (bash -n)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "Syntax error in $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $fail

      - name: ShellCheck (maintained toolkit — strict)
        run: |
          # -x follows sourced files; SC1091 = "can't follow external source".
          shellcheck -x -e SC1091 install.sh lib/*.sh modules/*.sh agent/*.sh

      - name: ShellCheck (legacy scripts — informational)
        continue-on-error: true
        run: |
          shellcheck -e SC1091 uninstallers/*.sh app-uninstall.sh addprinters.sh \
            gatekeeper_commander.sh install-poc.sh mac_setup.sh
